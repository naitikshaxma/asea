# The whole product in containers: Postgres, Redis, Qdrant, the API, the BullMQ
# worker, the verification engine (agent-service) and the web app (nginx, which
# also proxies /api). Only the web port is published. Secrets come from the env file
# written by scripts/stack/stack.mjs (`npm run stack:up`, `npm run e2e`).
#
# compose.yaml is separate: local-development infrastructure only.

x-api-env: &api-env
  NODE_ENV: production
  # Served over plain HTTP on localhost
  COOKIE_SECURE: "false"
  PORT: "4000"
  HOST: 0.0.0.0
  LOG_LEVEL: ${LOG_LEVEL:-info}
  DATABASE_URL: postgresql://asea:${POSTGRES_PASSWORD:?run npm run stack:up}@postgres:5432/asea
  REDIS_URL: redis://redis:6379
  JWT_SECRET: ${JWT_SECRET:?run npm run stack:up}
  COOKIE_SECRET: ${COOKIE_SECRET:?run npm run stack:up}
  AUTH_STATE_STORE: ${AUTH_STATE_STORE:-redis}
  AUTH_STATE_KEY_PREFIX: ${AUTH_STATE_KEY_PREFIX:-asea}
  AUTH_RATE_LIMIT_WINDOW_MS: ${AUTH_RATE_LIMIT_WINDOW_MS:-900000}
  AUTH_RATE_LIMIT_MAX: ${AUTH_RATE_LIMIT_MAX:-5}
  CORS_ORIGIN: http://localhost:${ASEA_WEB_PORT:-8080}
  AI_SERVICE_URL: http://agent-service:8000
  INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:?run npm run stack:up}
  ALLOWED_REPO_ROOTS: /repos
  TASK_WORKSPACE_ROOT: /task-workspaces
  # Repository code cannot access a Docker daemon from the application stack.
  SANDBOX_PROVIDER: unavailable
  # Links in PR comments and the webhook URL shown in the UI
  PUBLIC_WEB_URL: http://localhost:${ASEA_WEB_PORT:-8080}
  # Optional: a token that may comment on pull requests (empty = comments skipped)
  GITHUB_TOKEN: ${GITHUB_TOKEN:-}

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: asea
      POSTGRES_USER: asea
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?run npm run stack:up}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U asea -d asea"]
      interval: 2s
      timeout: 5s
      retries: 30

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30

  qdrant:
    image: qdrant/qdrant:v1.19.0
    volumes:
      - qdrantdata:/qdrant/storage
    healthcheck:
      # The image has no curl or wget; bash's /dev/tcp checks the HTTP port is open
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/6333 && printf 'GET /readyz HTTP/1.0\\r\\n\\r\\n' >&3 && grep -q '200 OK' <&3"]
      interval: 3s
      timeout: 5s
      retries: 30

  agent-service:
    build:
      context: .
      dockerfile: services/agent-service/Dockerfile
    environment:
      ENVIRONMENT: production
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:?run npm run stack:up}
      # Without a usable provider/key the service skips LLM stages. Select
      # fake explicitly for deterministic tests; it is not a live AI provider.
      LLM_PROVIDER: ${LLM_PROVIDER:-anthropic}
      LLM_API_KEY: ${LLM_API_KEY:-}
      MODEL_NAME: ${MODEL_NAME:-}
      REVIEW_LLM_PROVIDER: ${REVIEW_LLM_PROVIDER:-}
      REVIEW_LLM_API_KEY: ${REVIEW_LLM_API_KEY:-}
      REVIEW_MODEL_NAME: ${REVIEW_MODEL_NAME:-}
      QDRANT_URL: http://qdrant:6333
    depends_on:
      qdrant: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 3s
      timeout: 5s
      retries: 30

  # Builds the demo git repository (scripts/demo) into the shared repos volume once
  repos-init:
    build:
      context: .
      dockerfile: services/api/Dockerfile
    command: ["node", "/app/scripts/demo/create-demo-repo.mjs", "/repos/demo_app", "/app/demo/fixtures"]
    volumes:
      - repos:/repos
    restart: "no"

  api:
    build:
      context: .
      dockerfile: services/api/Dockerfile
    environment: *api-env
    volumes:
      - repos:/repos:ro
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      repos-init: { condition: service_completed_successfully }
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:4000/health').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
      interval: 3s
      timeout: 5s
      retries: 40

  worker:
    build:
      context: .
      dockerfile: services/api/Dockerfile
    command: ["node", "dist/worker.js"]
    environment: *api-env
    volumes:
      - repos:/repos
      - taskworkspaces:/task-workspaces
    depends_on:
      api: { condition: service_healthy }
      agent-service: { condition: service_healthy }

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    ports:
      - "127.0.0.1:${ASEA_WEB_PORT:-8080}:80"
    depends_on:
      api: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/health"]
      interval: 3s
      timeout: 5s
      retries: 30

volumes:
  pgdata:
  redisdata:
  qdrantdata:
  repos:
  taskworkspaces:
