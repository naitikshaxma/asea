name: autonomous-engineer

services:
  postgres:
    image: postgres:16-alpine
    container_name: ae-postgres-dev
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-autonomous_dev}
      POSTGRES_USER: ${POSTGRES_USER:-dev_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dev_password}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-dev_user} -d ${POSTGRES_DB:-autonomous_dev}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: ae-redis-dev
    command: redis-server --appendonly yes
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_dev_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 3s
    restart: unless-stopped

  # Repository index for the architecture agent (set QDRANT_URL=http://localhost:6333
  # for the agent service; without it the service uses an in-memory index)
  qdrant:
    image: qdrant/qdrant:v1.19.0
    container_name: ae-qdrant-dev
    ports:
      - "127.0.0.1:${QDRANT_PORT:-6333}:6333"
    volumes:
      - qdrant_dev_data:/qdrant/storage
    healthcheck:
      # The image has no curl or wget; bash's /dev/tcp checks the HTTP port is open
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/6333 && printf 'GET /readyz HTTP/1.0\\r\\n\\r\\n' >&3 && grep -q '200 OK' <&3"]
      interval: 3s
      timeout: 5s
      retries: 30
    restart: unless-stopped

volumes:
  postgres_dev_data:
    name: ae_postgres_dev_data
  redis_dev_data:
    name: ae_redis_dev_data
  qdrant_dev_data:
    name: ae_qdrant_dev_data
