# Added to compose.stack.yaml by `npm run e2e`: a fake GitHub API that records
# the PR comments the worker posts (e2e/github-mock/server.mjs).
services:
  # The E2E stack explicitly uses the deterministic stand-in. This is test
  # infrastructure, not the default behavior of a keyless application stack.
  agent-service:
    environment:
      LLM_PROVIDER: fake

  github-mock:
    image: node:24-alpine
    command: ["node", "/mock/server.mjs"]
    environment:
      PORT: "9999"
      EXPECTED_TOKEN: e2e-github-token
    volumes:
      - ./e2e/github-mock:/mock:ro
    ports:
      - "127.0.0.1:${E2E_GITHUB_MOCK_PORT:-18099}:9999"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9999/health"]
      interval: 2s
      timeout: 5s
      retries: 30

  api:
    environment:
      GITHUB_TOKEN: e2e-github-token
      # E2E suites share one client IP and register in parallel; auth throttling
      # is covered by API unit tests, so keep it from masking unrelated flows.
      AUTH_RATE_LIMIT_MAX: "100"

  worker:
    environment:
      GITHUB_TOKEN: e2e-github-token
      GITHUB_API_URL: http://github-mock:9999
    depends_on:
      github-mock: { condition: service_healthy }
